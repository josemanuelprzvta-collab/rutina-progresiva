<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Rutina"><style>html{color-scheme:dark;background:#07090e;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Rutina Progresiva</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#07090e">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>:root{--bg:#07090e;--bg2:#0d1119;--card:#0f141d;--line:#1d2533;--line2:#2a3447;--fg:#e6ebf5;--mute:#8693ab;--dim:#566178;--ac:#3da5ff;--ac-s:rgba(61,165,255,.14);--ok:#2cf5a8;--warn:#ffb020;color-scheme:dark;--f-d:'Bebas Neue','Impact',sans-serif;--f-b:'DM Sans',system-ui,sans-serif;--f-m:'DM Mono',ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-b);padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background-image:radial-gradient(900px 400px at 50% -120px,var(--ac-s),transparent 70%),linear-gradient(var(--bg),var(--bg));background-repeat:no-repeat}
#app{max-width:880px;margin:0 auto;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.hdr{padding-top:18px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand h1{font:400 clamp(34px,9vw,52px)/.9 var(--f-d);letter-spacing:.02em;margin:0}
.brand h1 b{color:var(--ac);font-weight:400;text-shadow:0 0 18px var(--ac)}
.eyebrow{font:500 10.5px var(--f-m);letter-spacing:.18em;color:var(--mute);text-transform:uppercase}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:400 20px var(--f-d)}
.weeks{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.wk{height:34px;border-radius:6px;border:1px solid var(--line);font:500 11px var(--f-m);color:var(--mute);background:var(--bg2);position:relative}
.wk.p0{--c:#3da5ff}.wk.p1{--c:#2cf5a8}.wk.p2{--c:#ff4d63}
.wk::after{content:"";position:absolute;left:5px;right:5px;bottom:4px;height:2px;border-radius:2px;background:var(--c);opacity:.35}
.wk.full::after{opacity:1;box-shadow:0 0 8px var(--c)}
.wk.on{color:#fff;border-color:var(--c);box-shadow:0 0 0 1px var(--c),0 0 14px -2px var(--c)}
.phase{border:1px solid var(--line);border-radius:12px;padding:14px;background:linear-gradient(135deg,var(--ac-s),transparent 60%),var(--card);display:grid;gap:6px}
.phase .t{font:400 26px/1 var(--f-d);letter-spacing:.04em;color:var(--ac);text-shadow:0 0 14px var(--ac-s)}
.phase p{margin:0;color:var(--mute);font-size:13.5px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:500 10.5px var(--f-m);letter-spacing:.06em;border:1px solid var(--line2);border-radius:99px;padding:3px 9px;color:var(--mute)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 0;background:linear-gradient(var(--bg) 75%,transparent)}
.dt{border:1px solid var(--line);background:var(--bg2);border-radius:9px;padding:7px 0 6px;display:grid;gap:2px;justify-items:center;font:500 11px var(--f-m);color:var(--mute);position:relative}
.dt i{font-style:normal;width:7px;height:7px;border-radius:50%;border:1px solid var(--dim)}
.dt.done i{background:var(--ok);border-color:var(--ok);box-shadow:0 0 8px var(--ok)}
.dt.rest{opacity:.6}
.dt.on{color:#fff;border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 14px -3px var(--ac)}
.dayh{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.dayh h2{font:400 clamp(30px,8vw,44px)/1 var(--f-d);margin:0;letter-spacing:.02em}
.dayh h2 small{display:block;font:500 12px var(--f-m);letter-spacing:.14em;color:var(--ac);text-transform:uppercase;margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px}
.kpi b{display:block;font:400 26px/1 var(--f-d);color:var(--fg)}
.kpi span{font:500 10px var(--f-m);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.tip{border-left:2px solid var(--ac);background:var(--bg2);border-radius:0 10px 10px 0;padding:10px 12px;font-size:13.5px;color:var(--mute)}
.tip strong{color:var(--fg)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:14px 0 4px;padding:15px;border-radius:12px;background:var(--ac);color:#04070b;font:400 22px/1 var(--f-d);letter-spacing:.06em;box-shadow:0 0 26px -4px var(--ac)}
.go:active{transform:scale(.99)}
.go.sec{background:transparent;color:var(--ac);border:1px solid var(--ac);box-shadow:none}
.prog{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--ac);box-shadow:0 0 10px var(--ac);transition:width .3s}
.grid{display:grid;gap:12px;margin-top:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.ex{border:1px solid var(--line);background:var(--card);border-radius:14px;overflow:hidden;min-width:0}
.ex.fin{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.fig{background:#0a0d13;border-bottom:1px solid var(--line);aspect-ratio:240/176;width:100%}
.fig svg{display:block;width:100%;height:100%}
.exb{padding:12px 14px 14px;display:grid;gap:8px}
.exb h3{margin:0;font:400 22px/1.05 var(--f-d);letter-spacing:.03em;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.new{font:500 9.5px var(--f-m);letter-spacing:.1em;color:#04070b;background:var(--warn);padding:2px 6px;border-radius:4px;flex:none;margin-top:3px}
.exb p{margin:0;font-size:13px;color:var(--mute)}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font:500 11px var(--f-m);color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.meta b{color:var(--ac);font-weight:500;font-size:13px}
.sets{display:flex;gap:6px;flex-wrap:wrap}
.set{min-width:44px;height:40px;padding:0 10px;border-radius:9px;border:1px solid var(--line2);background:var(--bg2);font:500 12px var(--f-m);color:var(--mute)}
.set.on{background:var(--ac-s);border-color:var(--ac);color:#fff;box-shadow:0 0 12px -3px var(--ac)}
.wrow{display:flex;gap:8px;align-items:center}
.wrow label{font:500 10.5px var(--f-m);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.wrow input{width:78px;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;color:var(--fg);font:500 15px var(--f-m);padding:7px 9px}
.wrow input:focus{outline:1px solid var(--ac);border-color:var(--ac)}
.restp{border:1px dashed var(--line2);border-radius:14px;padding:26px 18px;text-align:center;display:grid;gap:10px;justify-items:center;margin-top:14px}
.restp .ic{font-size:44px}
.restp h3{margin:0;font:400 32px/1 var(--f-d)}
.restp p{margin:0;color:var(--mute);max-width:46ch}
.nav{display:flex;gap:10px;margin-top:18px}
.nav button{flex:1;padding:12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2);font:500 12px var(--f-m);letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.cmp{margin-top:30px;display:grid;gap:10px}
.cmp h2{font:400 26px var(--f-d);margin:0;letter-spacing:.04em}
.cmpg{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:640px){.cmpg{grid-template-columns:repeat(3,1fr)}}
.cp{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);display:grid;gap:3px}
.cp.cur{border-color:var(--c);box-shadow:0 0 16px -6px var(--c)}
.cp h4{margin:0 0 4px;font:400 20px var(--f-d);color:var(--c);letter-spacing:.04em}
.cp div{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mute);border-top:1px solid var(--line);padding-top:4px}
.cp div b{color:var(--fg);font-weight:500;font-family:var(--f-m);font-size:12px;text-align:right}
.sync{font:500 10px var(--f-m);color:var(--dim);letter-spacing:.1em;text-align:center;margin-top:22px}

/* modo entrenamiento */
.tm{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:auto}
.tm[hidden]{display:none}
.tmw{width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:12px;padding-block:12px 14px;min-height:0}
.tmt{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tmt .x{width:40px;height:40px;border:1px solid var(--line2);border-radius:10px;font-size:18px;color:var(--mute)}
.tmt .c{font:500 11px var(--f-m);letter-spacing:.14em;color:var(--mute);text-transform:uppercase;text-align:center;flex:1}
.tmt .c b{color:var(--ac);font-weight:500}
.tmbar{display:flex;gap:3px}
.tmbar i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.tmbar i.d{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.tmbar i.n{background:var(--ac);opacity:.5}
.tm .fig{border:1px solid var(--line);border-radius:14px;flex:none;max-height:36vh;width:100%;aspect-ratio:240/176;margin-inline:auto}
.tm h2{margin:0;font:400 clamp(28px,8vw,40px)/1 var(--f-d);letter-spacing:.03em}
.tm .sub{color:var(--mute);font-size:13.5px;margin:0}
.big{font:400 clamp(76px,26vw,130px)/.9 var(--f-d);text-align:center;color:var(--fg);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.big.ac{color:var(--ac);text-shadow:0 0 28px var(--ac)}
.big.rs{color:var(--warn);text-shadow:0 0 24px rgba(255,176,32,.5)}
.phl{text-align:center;font:500 12px var(--f-m);letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.phl.w{color:var(--ac)}.phl.r{color:var(--warn)}
.tmc{display:flex;gap:8px;margin-top:auto}
.tmc button{white-space:nowrap;flex:1;padding:15px 8px;border-radius:12px;border:1px solid var(--line2);background:var(--bg2);font:400 20px/1 var(--f-d);letter-spacing:.08em}
.tmc .p{background:var(--ac);color:#04070b;border-color:var(--ac);flex:2;box-shadow:0 0 22px -5px var(--ac)}
.tm .wrow{justify-content:center}
.sdots{display:flex;gap:8px;justify-content:center}
.sdots i{width:12px;height:12px;border-radius:50%;border:1px solid var(--dim)}
.sdots i.d{background:var(--ac);border-color:var(--ac);box-shadow:0 0 8px var(--ac)}
.sdots i.n{border-color:var(--ac)}
.done-box{display:grid;gap:10px;justify-items:center;text-align:center;margin:auto 0}
.done-box .big{color:var(--ok);text-shadow:0 0 28px var(--ok)}
.flash{animation:fl .5s}
@keyframes fl{from{background:var(--ac-s)}to{background:var(--bg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* esquemas anatómicos */
.fig.im{position:relative;overflow:hidden;background:#000;aspect-ratio:3/2}
.fig.im img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:22px 14px 26px;mix-blend-mode:screen;animation:gl 2.4s ease-in-out infinite alternate}
@keyframes gl{from{filter:brightness(.9) saturate(.95)}to{filter:brightness(1.28) saturate(1.2)}}
.fig.im::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55))}
.fig.im::after{content:"";position:absolute;left:10px;top:10px;width:12px;height:12px;border-left:1px solid var(--line2);border-top:1px solid var(--line2);z-index:3}
.fig.im .ht,.fig.im .hb{position:absolute;z-index:3;font:500 10px var(--f-m);letter-spacing:.14em;text-transform:uppercase}
.fig.im .ht{left:26px;top:9px;color:var(--mute)}
.fig.im .hb{left:14px;bottom:8px;color:var(--ac);text-shadow:0 0 8px var(--ac)}
.tm .fig.im{max-height:36vh;aspect-ratio:3/2;width:100%}
@media (prefers-reduced-motion:reduce){.fig.im img{animation:none!important}}
</style>

var DN=['LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO','DOMINGO'];
var $=function(s,r){return (r||document).querySelector(s)};
var CI=['b','g','r'],CP=0,FG=window.FIGS||{};
function figTag(name,no,m,id){
  var pid=PM[name],n=('0'+no).slice(-2);
  if(!pid||!FG[pid])return '<div class="fig"'+(id?' id="'+id+'"':'')+' data-fig data-n="'+esc(name)+'" data-no="'+no+'"></div>';
  return '<div class="fig im"'+(id?' id="'+id+'"':'')+' data-n="'+esc(name)+'"><img src="fig/'+pid+'.'+CI[CP]+'.jpg" alt="Esquema anatómico: '+esc(name)+'" decoding="async"'+(id?'':' loading="lazy"')+'><span class="ht">FIG.'+n+'</span>'+(m?'<span class="hb">'+esc(m)+'</span>':'')+'</div>';
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rgba(h,a){var n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'}

/* ---------- estado ---------- */
var LS='rutina_progresiva_v1';
var S={week:1,day:(new Date().getDay()+6)%7,prog:{},wt:{}};
var cloud=null,syncState='local';
function lsGet(){try{var r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}
function lsSet(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
var saveT=null,saving=false,dirty=false;
function save(){lsSet();dirty=true;if(!cloud)return;clearTimeout(saveT);saveT=setTimeout(push,900)}
function push(){
  if(saving||!cloud){return}
  saving=true;dirty=false;
  cloud.set({week:S.week,day:S.day,prog:S.prog,wt:S.wt}).then(function(){syncState='cloud'}).catch(function(){syncState='local'}).then(function(){saving=false;paintSync();if(dirty)push()});
}
function merge(a){ // a = datos de la nube
  if(!a)return;
  S.prog=a.prog||S.prog;S.wt=a.wt||S.wt;
  if(a.week)S.week=a.week;if(a.day!=null)S.day=a.day;
}
function initCloud(){
  try{
    if(!window.claude||!claude.use)return;
    Promise.all([claude.use('db'),claude.use('user')]).then(function(r){
      var db=r[0],user=r[1];if(!db||!user)return null;
      return user.id().then(function(id){
        var ref=db.doc('data/users/'+id+'/progress');
        return ref.get().then(function(sn){
          if(sn.exists){merge(sn.data());lsSet()}
          cloud=ref;syncState='cloud';
          if(!sn.exists)push();
          draw();
        });
      });
    }).catch(function(){});
  }catch(e){}
}
function paintSync(){var el=$('#sync');if(el)el.textContent=syncState==='cloud'?'● PROGRESO GUARDADO EN TU CUENTA':'○ PROGRESO SOLO EN ESTE DISPOSITIVO'}

/* ---------- datos ---------- */
var D=window.RUTINA,POSES=window.POSES,PM=window.POSEMAP;
function phaseOf(w){return Math.ceil(w/4)-1}
function dayOf(w,d){return D[phaseOf(w)].days[d]}
function key(w,d){return 'w'+w+'d'+d}
function parse(e){
  var s=e.s,m;
  if(m=s.match(/(\d+)\s*rondas\s*·\s*(\d+)s\/(\d+)s/))return {k:'hiit',sets:1,rounds:+m[1],w:+m[2],r:+m[3],txt:m[1]+' rondas · '+m[2]+'s / '+m[3]+'s'};
  if(m=s.match(/^(\d+)\s*min/))return {k:'time',sets:1,secs:+m[1]*60,txt:m[1]+' min'};
  if(m=s.match(/^(\d+)×(\d+)s(\/lado)?$/))return {k:'hold',sets:+m[1],secs:+m[2],sides:m[3]?2:1,txt:m[1]+' × '+m[2]+'s'+(m[3]?' por lado':'')};
  if(m=s.match(/^(\d+)×(\d+)/)){var tq=/toques/.test(s),sd=/\/lado/.test(s);return {k:'reps',sets:+m[1],reps:+m[2],unit:tq?'toques':(sd?'reps por lado':'reps'),txt:m[1]+' × '+m[2]+(tq?' toques':'')+(sd?' por lado':'')}}
  return {k:'time',sets:1,secs:60,txt:s};
}
function restSecs(w){var m=(D[phaseOf(w)].compare[2].val||'').match(/(\d+)/);return m?+m[1]:60}
function getSets(w,d,i,n){var p=S.prog[key(w,d)];var s=(p&&p[i])||'';var a=[];for(var j=0;j<n;j++)a.push(s.charAt(j)==='1');return a}
function setSet(w,d,i,j,v,n){
  var k=key(w,d);var p=S.prog[k]||(S.prog[k]={});var a=getSets(w,d,i,n);a[j]=v;p[i]=a.map(function(x){return x?'1':'0'}).join('');save();
}
function exProg(w,d){var dy=dayOf(w,d);if(dy.rest){var p=S.prog[key(w,d)];return {done:p&&p.r==='1'?1:0,total:1}}
  var done=0,tot=0;dy.exercises.forEach(function(e,i){var n=parse(e).sets;tot+=n;getSets(w,d,i,n).forEach(function(x){if(x)done++})});return {done:done,total:tot}}
function isDone(w,d){var p=exProg(w,d);return p.total>0&&p.done>=p.total}
function weekDone(w){var n=0;for(var d=0;d<7;d++)if(isDone(w,d))n++;return n}

/* ---------- pintar ---------- */
var root;
function setTheme(){var c=COLS[phaseOf(S.week)],s=document.documentElement.style;s.setProperty('--ac',c);s.setProperty('--ac-s',rgba(c,.14))}
function draw(){
  setTheme();CP=phaseOf(S.week);
  FIG.unmountAll(root);
  var ph=D[phaseOf(S.week)],dy=dayOf(S.week,S.day),h='';
  var totalDays=0,doneDays=0;for(var w=1;w<=12;w++)for(var d=0;d<7;d++)if(!dayOf(w,d).rest){totalDays++;if(isDone(w,d))doneDays++}
  var pct=Math.round(doneDays/totalDays*100);
  h+='<header class="hdr"><div class="brand"><div><div class="eyebrow">Plan de 12 semanas</div><h1>RUTINA <b>PROGRESIVA</b></h1></div>'+
    '<div class="ring" title="Avance total"><svg viewBox="0 0 62 62"><circle cx="31" cy="31" r="26" fill="none" stroke="var(--line)" stroke-width="4"/><circle cx="31" cy="31" r="26" fill="none" stroke="var(--ac)" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(163.4*pct/100)+' 163.4" style="filter:drop-shadow(0 0 4px var(--ac))"/></svg><span>'+pct+'%</span></div></div>';
  h+='<div class="weeks">';for(var w=1;w<=12;w++){var full=weekDone(w)>=5;h+='<button class="wk p'+phaseOf(w)+(w===S.week?' on':'')+(full?' full':'')+'" data-a="week" data-v="'+w+'" aria-label="Semana '+w+'">'+w+'</button>'}h+='</div>';
  h+='<div class="phase"><div class="eyebrow">'+esc(ph.month)+' · SEMANA '+S.week+' · '+esc(ph.badge)+'</div><div class="t">'+esc(ph.title)+'</div><p>'+esc(ph.desc)+'</p><div class="chips">'+ph.stats.map(function(s){return '<span class="chip">'+esc(s.val)+' '+esc(s.lbl)+'</span>'}).join('')+'</div></div></header>';
  h+='<nav class="days">';for(var d=0;d<7;d++){var x=dayOf(S.week,d);h+='<button class="dt'+(d===S.day?' on':'')+(x.rest?' rest':'')+(isDone(S.week,d)?' done':'')+'" data-a="day" data-v="'+d+'">'+esc(x.short)+'<i></i></button>'}h+='</nav>';
  h+='<main>'+dayHTML(dy)+'</main>';
  h+='<section class="cmp"><h2>PROGRESIÓN DE LOS 3 MESES</h2><div class="cmpg">'+D.map(function(p,i){return '<div class="cp'+(i===phaseOf(S.week)?' cur':'')+'" style="--c:'+COLS[i]+'"><h4>'+esc(p.month)+' · '+esc(p.title)+'</h4>'+p.compare.map(function(c){return '<div><span>'+esc(c.key)+'</span><b>'+esc(c.val)+'</b></div>'}).join('')+'</div>'}).join('')+'</div></section>';
  h+='<div class="sync" id="sync"></div>';
  root.innerHTML=h;paintSync();
  var fe=root.querySelectorAll('[data-fig]');
  for(var i=0;i<fe.length;i++){var el=fe[i],P=POSES[PM[el.getAttribute('data-n')]];if(P)FIG.mount(el,P,COLS[phaseOf(S.week)],+el.getAttribute('data-no')||i+1)}
}
function dayHTML(dy){
  var h='<div class="dayh"><h2><small>'+DN[S.day]+' · SEMANA '+S.week+'</small>'+esc(dy.sub)+'</h2>';
  if(dy.stats&&dy.stats.length)h+='<div class="kpis">'+dy.stats.map(function(s){return '<div class="kpi"><b>'+esc(s.v)+'</b><span>'+esc(s.l)+'</span></div>'}).join('')+'</div>';
  h+='<div class="tip">'+dy.tip+'</div></div>';
  if(dy.rest){
    var dn=exProg(S.week,S.day).done;
    return h+'<div class="restp"><div class="ic">'+esc(dy.restIcon)+'</div><h3>'+esc(dy.restTitle)+'</h3><p>'+esc(dy.restDesc)+'</p><div class="chips">'+dy.restPills.map(function(p){return '<span class="chip">'+esc(p)+'</span>'}).join('')+'</div><button class="go'+(dn?'':' sec')+'" style="max-width:340px" data-a="rest">'+(dn?'✓ DÍA CUMPLIDO':'MARCAR COMO CUMPLIDO')+'</button></div>'+navHTML();
  }
  var p=exProg(S.week,S.day);
  h+='<button class="go" data-a="train">▶ '+(p.done?(p.done>=p.total?'REPETIR ENTRENAMIENTO':'CONTINUAR ENTRENAMIENTO'):'INICIAR ENTRENAMIENTO')+'</button><div class="prog"><i id="dprog" style="width:'+(p.done/p.total*100)+'%"></i></div><div class="grid">';
  dy.exercises.forEach(function(e,i){
    var q=parse(e),st=getSets(S.week,S.day,i,q.sets),fin=st.every(Boolean);
    h+='<article class="ex'+(fin?' fin':'')+'" id="ex'+i+'">'+figTag(e.n,i+1,e.m)+'<div class="exb"><h3><span>'+esc(e.n)+'</span>'+(e.isNew?'<span class="new">NUEVO</span>':'')+'</h3><p>'+esc(e.d)+'</p>'+
      '<div class="meta"><span>'+esc(e.m)+'</span><b>'+esc(q.txt)+'</b></div><div class="sets">';
    st.forEach(function(on,j){h+='<button class="set'+(on?' on':'')+'" data-a="set" data-i="'+i+'" data-j="'+j+'" aria-pressed="'+on+'">'+(q.sets>1?'S'+(j+1):'HECHO')+'</button>'});
    h+='</div>';
    if(q.k==='reps')h+='<div class="wrow"><label for="w'+i+'">Peso kg</label><input id="w'+i+'" data-a="wt" data-n="'+esc(e.n)+'" inputmode="decimal" placeholder="—" value="'+esc(S.wt[e.n]||'')+'"></div>';
    h+='</div></article>';
  });
  return h+'</div>'+navHTML();
}
function navHTML(){return '<div class="nav"><button data-a="prev">‹ Anterior</button><button data-a="next">Siguiente ›</button></div>'}
function refreshDay(){
  var dy=dayOf(S.week,S.day);if(dy.rest)return;
  var p=exProg(S.week,S.day),b=$('#dprog');if(b)b.style.width=(p.done/p.total*100)+'%';
  dy.exercises.forEach(function(e,i){var q=parse(e),st=getSets(S.week,S.day,i,q.sets),el=$('#ex'+i);if(!el)return;el.classList.toggle('fin',st.every(Boolean));
    var bs=el.querySelectorAll('.set');for(var j=0;j<bs.length;j++){bs[j].classList.toggle('on',st[j]);bs[j].setAttribute('aria-pressed',st[j])}});
  var dt=root.querySelectorAll('.dt')[S.day];if(dt)dt.classList.toggle('done',isDone(S.week,S.day));
  var wk=root.querySelectorAll('.wk')[S.week-1];if(wk)wk.classList.toggle('full',weekDone(S.week)>=5);
}
function go(w,d){S.week=Math.max(1,Math.min(12,w));S.day=d;save();draw();window.scrollTo(0,0)}
function step(n){var w=S.week,d=S.day+n;if(d<0){if(w>1){w--;d=6}else d=0}if(d>6){if(w<12){w++;d=0}else d=6}go(w,d)}

root=null;
document.addEventListener('DOMContentLoaded',function(){});

/* ---------- audio / vibración ---------- */
var AC=null;
function audio(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
function beep(f,ms,v){try{if(!AC)return;var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.value=v||.18;o.connect(g);g.connect(AC.destination);var t=AC.currentTime;g.gain.setValueAtTime(v||.18,t);g.gain.exponentialRampToValueAtTime(.001,t+ms/1000);o.start(t);o.stop(t+ms/1000+.02)}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p)}catch(e){}}

/* ---------- modo entrenamiento ---------- */
var tm=null,tmEl,timer=null,wl=null;
function fmt(ms){var s=Math.max(0,Math.ceil(ms/1000));var m=Math.floor(s/60);return m?m+':'+('0'+(s%60)).slice(-2):String(s)}
function openTM(){
  var dy=dayOf(S.week,S.day);if(dy.rest)return;audio();
  var ex=dy.exercises.map(function(e){return {e:e,q:parse(e)}});
  var i=0;for(;i<ex.length;i++){if(!getSets(S.week,S.day,i,ex[i].q.sets).every(Boolean))break}
  if(i>=ex.length)i=0;
  var set=0;if(i<ex.length){var st=getSets(S.week,S.day,i,ex[i].q.sets);set=Math.max(0,st.indexOf(false))}
  tm={w:S.week,d:S.day,ex:ex,i:i,set:set,ph:'ready',rs:restSecs(S.week)};
  tmEl.hidden=false;document.body.style.overflow='hidden';
  try{if(navigator.wakeLock)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}
  clearInterval(timer);timer=setInterval(tick,200);
  drawTM();
}
function closeTM(){
  tm=null;clearInterval(timer);tmEl.hidden=true;document.body.style.overflow='';FIG.unmountAll(tmEl);
  try{if(wl){wl.release();wl=null}}catch(e){}
  draw();
}
function cur(){return tm.ex[tm.i]}
function segsFor(q){
  var a=[],i;
  if(q.k==='hold')for(i=0;i<q.sides;i++)a.push({t:'w',ms:q.secs*1000,l:q.sides>1?'LADO '+(i+1)+' DE 2':'MANTÉN LA POSICIÓN'});
  else if(q.k==='time')a.push({t:'w',ms:q.secs*1000,l:'EN MARCHA'});
  else if(q.k==='hiit')for(i=0;i<q.rounds;i++){a.push({t:'w',ms:q.w*1000,l:'RONDA '+(i+1)+' / '+q.rounds});if(i<q.rounds-1)a.push({t:'r',ms:q.r*1000,l:'DESCANSA · RONDA '+(i+2)+' SIGUE'})}
  return a;
}
function startRun(){
  audio();var c=cur();tm.segs=segsFor(c.q);tm.seg=0;tm.ph='run';tm.paused=false;beep(880,260);vib(60);startSeg();
}
function startSeg(){var s=tm.segs[tm.seg];tm.total=s.ms;tm.end=Date.now()+s.ms;tm.last=null;drawTM()}
function finishSet(){
  var c=cur();setSet(tm.w,tm.d,tm.i,tm.set,true,c.q.sets);
  beep(990,380);vib([80,40,80]);
  tm.set++;
  var lastSet=tm.set>=c.q.sets;
  if(lastSet){tm.i++;tm.set=0}
  if(tm.i>=tm.ex.length){tm.ph='end';drawTM();return}
  var rs=tm.rs;if(c.q.k==='hiit'||c.q.k==='time')rs=Math.min(rs,30);
  startRest(rs,lastSet);
}
function startRest(sec,toNext){tm.ph='rest';tm.paused=false;tm.total=sec*1000;tm.end=Date.now()+tm.total;tm.last=null;tm.toNext=toNext;drawTM()}
function endRest(){tm.ph='ready';beep(880,240);vib(60);drawTM()}
function tick(){
  if(!tm||tm.paused||(tm.ph!=='run'&&tm.ph!=='rest'))return;
  var left=tm.end-Date.now();
  var sec=Math.ceil(left/1000);
  if(sec<=3&&sec>=1&&sec!==tm.last){tm.last=sec;beep(600,90,.12)}
  if(left<=0){
    if(tm.ph==='rest'){endRest();return}
    tm.seg++;
    if(tm.seg>=tm.segs.length){finishSet();return}
    var n=tm.segs[tm.seg];beep(n.t==='w'?880:520,220);vib(n.t==='w'?[60,30,60]:40);startSeg();return;
  }
  var b=$('#big'),bar=$('#tbar');if(b)b.textContent=fmt(left);if(bar)bar.style.width=(100-left/tm.total*100)+'%';
}
function drawTM(){
  if(!tm)return;CP=phaseOf(tm.w);
  FIG.unmountAll(tmEl);
  var col=COLS[phaseOf(tm.w)],h='<div class="tmw">';
  var n=tm.ex.length,idx=Math.min(tm.i,n-1);
  h+='<div class="tmt"><button class="x" data-a="tmx" aria-label="Cerrar">✕</button><div class="c">'+(tm.ph==='end'?'COMPLETADO':'EJERCICIO <b>'+(idx+1)+'</b> / '+n)+'</div><div style="width:40px"></div></div>';
  h+='<div class="tmbar">';for(var k=0;k<n;k++){var dn=getSets(tm.w,tm.d,k,tm.ex[k].q.sets).every(Boolean);h+='<i class="'+(dn?'d':(k===idx&&tm.ph!=='end'?'n':''))+'"></i>'}h+='</div>';
  if(tm.ph==='end'){
    h+='<div class="done-box"><div class="eyebrow">ENTRENAMIENTO</div><div class="big">¡LISTO!</div><p class="sub">Terminaste '+esc(dayOf(tm.w,tm.d).sub)+'. Descansa, hidrátate y come bien.</p></div><div class="tmc"><button class="p" data-a="tmx">VOLVER</button></div></div>';
    tmEl.innerHTML=h;return;
  }
  var c=tm.ex[tm.i],q=c.q,e=c.e;
  if(tm.ph==='rest'){
    var nx=tm.toNext?tm.ex[tm.i]:c;
    h+='<div class="phl r">DESCANSO</div><div class="big rs" id="big">'+fmt(tm.end-Date.now())+'</div><div class="prog"><i id="tbar" style="width:0%;background:var(--warn);box-shadow:0 0 10px var(--warn)"></i></div>'+
      '<div class="eyebrow" style="text-align:center">'+(tm.toNext?'SIGUE':'PRÓXIMA SERIE')+'</div><h2 style="text-align:center">'+esc(nx.e.n)+'</h2>'+
      (tm.toNext?'':'<p class="sub" style="text-align:center">Serie '+(tm.set+1)+' de '+q.sets+'</p>')+
      figTag(nx.e.n,tm.ex.indexOf(nx)+1,nx.e.m,'tmfig')+
      '<div class="tmc"><button data-a="plus">+15s</button><button data-a="pause">'+(tm.paused?'▶':'❚❚')+'</button><button class="p" data-a="skiprest">SALTAR</button></div>';
  }else if(tm.ph==='run'){
    var sg=tm.segs[tm.seg];
    h+='<div class="phl '+(sg.t==='w'?'w':'r')+'">'+esc(sg.l)+'</div><div class="big '+(sg.t==='w'?'ac':'rs')+'" id="big">'+fmt(tm.paused?tm.left:tm.end-Date.now())+'</div><div class="prog"><i id="tbar" style="width:0%"></i></div>'+
      '<h2 style="text-align:center">'+esc(e.n)+'</h2>'+(q.k==='hold'||q.k==='reps'?'<div class="sdots">'+dots(q.sets,tm.set)+'</div>':'')+
      figTag(e.n,idx+1,e.m,'tmfig')+
      '<div class="tmc"><button data-a="pause">'+(tm.paused?'▶ SEGUIR':'❚❚ PAUSA')+'</button><button class="p" data-a="skipseg">TERMINAR</button></div>';
  }else{ // ready
    h+='<div class="eyebrow">'+esc(e.m)+'</div><h2>'+esc(e.n)+'</h2><p class="sub">'+esc(e.d)+'</p>'+
      figTag(e.n,idx+1,e.m,'tmfig');
    if(q.k==='reps'){
      h+='<div class="sdots">'+dots(q.sets,tm.set)+'</div><div class="phl w">SERIE '+(tm.set+1)+' / '+q.sets+'</div><div class="big ac">'+q.reps+'</div><div class="phl">'+q.unit.toUpperCase()+'</div>'+
        '<div class="wrow"><label for="tw">Peso kg</label><input id="tw" data-a="wt" data-n="'+esc(e.n)+'" inputmode="decimal" placeholder="—" value="'+esc(S.wt[e.n]||'')+'"></div>'+
        '<div class="tmc"><button data-a="skipex">SALTAR</button><button class="p" data-a="repdone">✓ SERIE HECHA</button></div>';
    }else{
      var lbl=q.k==='hiit'?q.rounds+' RONDAS · '+q.w+'s TRABAJO / '+q.r+'s PAUSA':q.k==='time'?q.txt.toUpperCase():(q.sets>1?'SERIE '+(tm.set+1)+' / '+q.sets+' · ':'')+q.secs+'s'+(q.sides>1?' POR LADO':'');
      h+=(q.k==='hold'?'<div class="sdots">'+dots(q.sets,tm.set)+'</div>':'')+'<div class="phl w">'+esc(lbl)+'</div>'+
        '<div class="tmc"><button data-a="skipex">SALTAR</button><button class="p" data-a="start">▶ INICIAR</button></div>';
    }
  }
  tmEl.innerHTML=h+'</div>';
  var f=$('#tmfig',tmEl);if(f&&!f.classList.contains('im')){var P=POSES[PM[f.getAttribute('data-n')]];if(P)FIG.mount(f,P,col,+f.getAttribute('data-no')||idx+1)}
  tick();
}
function dots(n,cur){var s='';for(var i=0;i<n;i++)s+='<i class="'+(i<cur?'d':(i===cur?'n':''))+'"></i>';return s}
function nextEx(){tm.i++;tm.set=0;if(tm.i>=tm.ex.length){tm.ph='end'}else tm.ph='ready';drawTM()}

/* ---------- eventos ---------- */
function onClick(ev){
  var t=ev.target.closest('[data-a]');if(!t)return;var a=t.getAttribute('data-a');
  if(a==='wt')return;
  audio();
  if(a==='week')go(+t.getAttribute('data-v'),S.day);
  else if(a==='day')go(S.week,+t.getAttribute('data-v'));
  else if(a==='prev')step(-1);else if(a==='next')step(1);
  else if(a==='train')openTM();
  else if(a==='rest'){var k=key(S.week,S.day),p=S.prog[k]||(S.prog[k]={});p.r=p.r==='1'?'0':'1';save();draw()}
  else if(a==='set'){var i=+t.getAttribute('data-i'),j=+t.getAttribute('data-j'),q=parse(dayOf(S.week,S.day).exercises[i]);var cur=getSets(S.week,S.day,i,q.sets);setSet(S.week,S.day,i,j,!cur[j],q.sets);refreshDay()}
  else if(a==='tmx')closeTM();
  else if(!tm)return;
  else if(a==='start')startRun();
  else if(a==='repdone')finishSet();
  else if(a==='skipex')nextEx();
  else if(a==='skiprest')endRest();
  else if(a==='plus'){if(tm.paused)tm.left+=15000;else tm.end+=15000;tm.total+=15000;tick()}
  else if(a==='pause'){if(tm.paused){tm.paused=false;tm.end=Date.now()+tm.left}else{tm.left=tm.end-Date.now();tm.paused=true}drawTM()}
  else if(a==='skipseg'){tm.seg=tm.segs.length;finishSet()}
}
function onInput(ev){var t=ev.target;if(t.getAttribute&&t.getAttribute('data-a')==='wt'){var n=t.getAttribute('data-n');S.wt[n]=t.value.replace(',','.').slice(0,6);save()}}
document.addEventListener('click',onClick);
document.addEventListener('input',onInput);
document.addEventListener('keydown',function(e){
  if(e.target&&/INPUT/.test(e.target.tagName))return;
  if(e.key==='Escape'&&tm)closeTM();
  else if(!tm){if(e.key==='ArrowLeft')step(-1);else if(e.key==='ArrowRight')step(1)}
});
var sx=null;
document.addEventListener('touchstart',function(e){sx=e.touches.length===1&&!tm?[e.touches[0].clientX,e.touches[0].clientY]:null},{passive:true});
document.addEventListener('touchend',function(e){if(!sx)return;var t=e.changedTouches[0],dx=t.clientX-sx[0],dy=t.clientY-sx[1];sx=null;if(Math.abs(dx)>90&&Math.abs(dx)>Math.abs(dy)*2.2&&!(e.target.closest&&e.target.closest('input')))step(dx<0?1:-1)},{passive:true});
document.addEventListener('visibilitychange',function(){if(tm&&!document.hidden){try{if(navigator.wakeLock&&!wl)navigator.wakeLock.request('screen').then(function(l){wl=l}).catch(function(){})}catch(e){}}});

/* ---------- arranque ---------- */
root=document.getElementById('app');tmEl=document.getElementById('tm');
var saved=lsGet();if(saved){S.prog=saved.prog||{};S.wt=saved.wt||{};if(saved.week)S.week=saved.week;if(saved.day!=null)S.day=saved.day}
draw();initCloud();
})();
